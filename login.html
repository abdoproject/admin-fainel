<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>دخول الأدمن - لوحة التحكم</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root { --primary:#6c63ff; --secondary:#ff6584; --dark:#1a1a2e; --font:'Cairo',sans-serif; }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font);background:var(--dark);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;direction:rtl;overflow:hidden}
    .bg-shapes{position:fixed;inset:0;pointer-events:none;z-index:0}
    .shape{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.15}
    .shape-1{width:400px;height:400px;background:var(--primary);top:-100px;right:-100px}
    .shape-2{width:300px;height:300px;background:var(--secondary);bottom:-80px;left:-80px}
    .shape-3{width:200px;height:200px;background:#43e97b;top:50%;left:50%;transform:translate(-50%,-50%)}
    .login-card{position:relative;z-index:1;background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:48px 40px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
    .login-logo{text-align:center;margin-bottom:32px}
    .login-logo .icon{width:70px;height:70px;background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 16px;box-shadow:0 8px 25px rgba(108,99,255,0.4)}
    .login-logo h1{font-size:1.8rem;font-weight:900;color:white;margin-bottom:6px}
    .login-logo p{color:rgba(255,255,255,0.5);font-size:0.9rem}
    .form-group{margin-bottom:20px}
    .form-group label{display:block;color:rgba(255,255,255,0.7);font-size:0.9rem;font-weight:600;margin-bottom:8px}
    .input-wrap{position:relative}
    .input-wrap i{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.3);font-size:1rem}
    .input-wrap input{width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:13px 44px 13px 14px;color:white;font-family:var(--font);font-size:0.95rem;transition:all 0.3s}
    .input-wrap input:focus{outline:none;border-color:var(--primary);background:rgba(108,99,255,0.1);box-shadow:0 0 0 4px rgba(108,99,255,0.15)}
    .input-wrap input::placeholder{color:rgba(255,255,255,0.25)}
    .toggle-pw{position:absolute;left:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,0.3);cursor:pointer;font-size:1rem;transition:color 0.3s}
    .toggle-pw:hover{color:rgba(255,255,255,0.7)}
    .error-msg{background:rgba(255,101,132,0.15);border:1px solid rgba(255,101,132,0.3);color:#ff6584;padding:12px 16px;border-radius:10px;font-size:0.9rem;margin-bottom:16px;display:none;align-items:center;gap:8px}
    .btn-login{width:100%;background:linear-gradient(135deg,var(--primary),var(--secondary));color:white;border:none;padding:14px;border-radius:50px;font-family:var(--font);font-size:1rem;font-weight:700;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center;gap:10px}
    .btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(108,99,255,0.4)}
    .btn-login:disabled{opacity:0.6;cursor:not-allowed;transform:none}
    .admin-note{text-align:center;margin-top:24px;color:rgba(255,255,255,0.3);font-size:0.85rem;display:flex;align-items:center;justify-content:center;gap:8px}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    .fa-spin{animation:spin 0.8s linear infinite}
  </style>
</head>
<body>
<div class="bg-shapes">
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>
  <div class="shape shape-3"></div>
</div>
<div class="login-card">
  <div class="login-logo">
    <div class="icon"><i class="fas fa-shield-alt"></i></div>
    <h1>لوحة التحكم</h1>
    <p>للمسؤولين المعتمدين فقط</p>
  </div>
  <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
    <div class="form-group">
      <label>البريد الإلكتروني</label>
      <div class="input-wrap">
        <i class="fas fa-envelope"></i>
        <input type="email" id="admin-email" placeholder="admin@example.com" required/>
      </div>
    </div>
    <div class="form-group">
      <label>كلمة المرور</label>
      <div class="input-wrap">
        <i class="fas fa-lock"></i>
        <input type="password" id="admin-password" placeholder="••••••••" required/>
        <button type="button" class="toggle-pw" onclick="togglePw()"><i class="fas fa-eye" id="pw-icon"></i></button>
      </div>
    </div>
    <div class="error-msg" id="error-msg"><i class="fas fa-exclamation-circle"></i><span id="error-text"></span></div>
    <button type="submit" class="btn-login" id="login-btn">
      <span id="btn-text"><i class="fas fa-sign-in-alt"></i> دخول</span>
      <span id="btn-loader" style="display:none"><i class="fas fa-spinner fa-spin"></i> جاري التحقق...</span>
    </button>
  </form>
  <div class="admin-note"><i class="fas fa-lock"></i> هذه الصفحة محمية ومخصصة للمسؤولين فقط</div>
</div>
<script type="module" src="js/admin-auth.js"></script>
</body>
</html>
